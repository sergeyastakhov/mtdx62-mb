[build-system]
requires = ["flit_core >=2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mtdx62-mb"
authors = [{ name = "Sergey Astakhov", email = "sergeyastakhov@mail.ru" }]
description = "Python library for connecting MTDx62-MB human presence sensor over Modbus."
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
]
requires-python = ">=3.12"
dynamic = ["version"]

# Protocol + the device-modelling framework (modbus_connection.model). The caller
# injects a ModbusUnit built from whichever backend they choose.
dependencies = ["modbus-connection>=3.6"]

[project.optional-dependencies]
spark = ["pyspark>=3.0.0"]
# Concrete backend for the script/query.py CLI (pip install mtdx62-mb[cli]).
cli = ["modbus-connection[pymodbus]>=3.6"]

[project.urls]
Documentation = "https://github.com/sergeyastakhov/mtdx62-mb/tree/main#readme"
Source = "https://github.com/sergeyastakhov/mtdx62-mb"
Tracker = "https://github.com/sergeyastakhov/mtdx62-mb/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Tests run against the in-memory mock backend that ships with
    # modbus-connection (its pytest plugin is auto-registered); no real backend
    # or server is needed.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
